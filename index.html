<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI 외출 도우미</title>

  <link rel="stylesheet" href="style.css">

  <!-- 카카오 지도 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=acf4c676e9ba77bfcad6abc05c23a9ee&libraries=services"></script>
</head>

<body>
  <div class="container">

    <h1>🚶 AI 외출 도우미</h1>

    <p class="description">
      현재 위치에서 목적지까지 가장 편리한 이동 방법을 찾아드립니다.
    </p>

    <div class="search-grid">

      <!-- 현재 위치 -->
      <section class="card">
        <h2>📍 현재 위치</h2>

        <button id="locationBtn">
          현재 위치 확인
        </button>

        <div id="locationResult" class="result-box">
          현재 위치를 확인해주세요.
        </div>
      </section>


      <!-- 목적지 검색 -->
      <section class="card">
        <h2>🔎 목적지 검색</h2>

        <div class="destination-search">

          <input
            type="text"
            id="destinationInput"
            placeholder="예: 서울역, 경복궁"
          >

          <button id="searchBtn">
            검색
          </button>

        </div>

        <select id="destinationSelect">
          <option value="">
            검색 결과를 선택하세요
          </option>
        </select>

        <div id="destinationResult" class="result-box">
          목적지를 검색해주세요.
        </div>

      </section>

    </div>


    <!-- 지도 -->
    <div class="map-wrapper">
      <div id="map"></div>
    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
