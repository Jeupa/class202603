<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI 외출 도우미</title>

  <link rel="stylesheet" href="style.css">

  <!-- 카카오 지도 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=acf4c676e9ba77bfcad6abc05c23a9ee&libraries=services"></script>
</head>

<body>
  <div class="container">

    <h3>🚶 AI 외출 도우미</h3>


    <!-- 지도 -->
    <div id="map"></div>

    <!-- 출발지 -->
    <section class="card">
      <h2>📍 출발지 설정</h2>

      <div class="departure-controls">

        <button id="currentLocationBtn">
          현재 위치로 설정
        </button>

        <div class="search-area">

          <div class="search-row">

            <input
              type="text"
              id="departureInput"
              placeholder="출발지를 검색하세요"
              autocomplete="off"
            >

            <button id="departureSearchBtn">
              검색
            </button>

          </div>

          <div
            id="departureSearchResults"
            class="search-results">
          </div>

        </div>

      </div>

      <div id="departureResult" class="result-box">
        현재 위치를 확인하고 있습니다...
      </div>

    </section>


    <!-- 목적지 -->
    <section class="card">

      <h2>🎯 목적지 설정</h2>

      <div class="search-area">

        <div class="search-row">

          <input
            type="text"
            id="destinationInput"
            placeholder="목적지를 검색하세요"
            autocomplete="off"
          >

          <button id="destinationSearchBtn">
            검색
          </button>

        </div>

        <div
          id="destinationSearchResults"
          class="search-results">
        </div>

      </div>

      <div id="destinationResult" class="result-box">
        목적지를 검색해주세요.
      </div>

    </section>

  </div>

  <script src="script.js"></script>


</body>
</html>
